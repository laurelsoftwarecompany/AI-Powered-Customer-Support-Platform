name: Build Release APK

on:
  push:
    branches: [ main ]
    paths:
      - 'customer_support_platform/Mobile app/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        working-directory: "customer_support_platform/Mobile app"
        run: flutter pub get

      - name: Build Release APK
        working-directory: "customer_support_platform/Mobile app"
        run: flutter build apk --release --dart-define=API_BASE_URL=https://customer-support-backend-ztc0.onrender.com/api/v1

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Laurel-Release-APK
          path: customer_support_platform/Mobile app/build/app/outputs/flutter-apk/app-release.apk
