services:
  - type: web
    name: customer-support-backend
    runtime: docker
    dockerfilePath: customer_support_platform/backend/Dockerfile
    dockerContext: customer_support_platform/backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: RAG_TOP_K
        value: "4"
      - key: RAG_MIN_SCORE
        value: "0.5"
      - key: CONFIDENCE_THRESHOLD
        value: "0.70"
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://localhost:8080"
